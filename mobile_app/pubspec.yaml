name: smart_health_vault
description: A new Flutter project.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Auth & Core
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  # State & Routing
  provider: ^6.1.0
  go_router: ^13.0.0
  # UI
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  # File handling
  firebase_storage: ^12.0.0
  file_picker: ^8.0.0
  url_launcher: ^6.3.0
  # AWS S3 & Env
  # REST API
  http: ^1.2.0
  # Notifications
  flutter_local_notifications: ^17.2.4
  firebase_messaging: ^15.1.6
  timezone: ^0.9.4
  # Data Visualization
  fl_chart: ^0.69.2
  minio: ^3.5.8
  flutter_dotenv: ^6.0.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# ── App Icon Configuration ──────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#10B981"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21

# ── Splash Screen Configuration ─────────────────────────────
flutter_native_splash:
  color: "#10B981"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#10B981"
    image: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - .env
  
  # Fonts (uncomment when you add custom fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
